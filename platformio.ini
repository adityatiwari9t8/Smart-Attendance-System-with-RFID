; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
;   pio run -t upload            build + flash the ESP32 (the default env)
;   pio device monitor           serial console (115200, typed text is echoed)
;   pio run -t erase             wipe the board's flash (roster, attendance, queue)
;   pio test -e native           run the host-side unit tests (no board needed)

[platformio]
; What the VS Code bottom-bar Build/Upload buttons (and a bare `pio run`)
; use. Without this they would also build the native test env, which has
; no main(), and report FAILED after a perfectly good upload.
default_envs = hardware

[env:hardware]
; Pinned so a future toolchain or library release can't silently change
; behaviour between "it worked when I tested it" and "I rebuilt it on my
; own board".
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; Show what you type in the serial monitor (it is not echoed otherwise),
; and turn a crash's raw backtrace addresses into file:line.
monitor_echo = yes
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wextra
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BusIO @ 1.17.4
    miguelbalboa/MFRC522 @ 1.4.12

; Host-side unit tests for the logic that has no hardware dependency.
; Arduino's String/Preferences are replaced by small mocks in test/mocks.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<StudentDatabase.cpp> +<Outbox.cpp> +<BackendResponse.cpp>
build_flags = -std=gnu++17 -Wall -Wextra -Itest/mocks -Iinclude
